<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熊熊心情教室</title>
<meta name="description" content="給 3 歲孩子的情緒辨識互動課：看表情、聽聲音、說出感覺、學冷靜魔法、練習再試一次。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：上方站別列（圖示）＋中間大舞台（孩子看）＋下方大按鈕；大人提示收在抽屜 */
:root{
  --bg:#E6F2F4; --paper:#FFFFFF; --ink:#24384A; --mute:#62788A; --line:#CFE1E7; --accent:#2B7AA3; --accent-2:#FFF4D6;
  --happy:#FFC23C; --sad:#5B9BE6; --angry:#EF5350; --scared:#9B7BD8; --surprised:#FF7EB6; --calm:#3DBE84;
  --kid:"Huninn","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}

/* 頂部 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--kid);font-size:22px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:40px;height:40px}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pill.over{border-color:var(--angry);color:var(--angry)}
.pill b{font-size:18px}
.iconbtn{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px}
.iconbtn[aria-pressed="false"]{opacity:.55}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;width:54px;height:54px;border-radius:16px;background:var(--paper);border:2px solid var(--line);font-size:26px;display:grid;place-items:center;position:relative}
.step.on{border-color:var(--accent);background:var(--accent-2);transform:translateY(-2px);box-shadow:0 4px 0 var(--accent)}
.step.done::after{content:"✓";position:absolute;right:-4px;top:-6px;background:var(--calm);color:#fff;font-size:12px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--body);font-weight:700}
.step small{position:absolute;bottom:-2px;left:0;right:0;font-size:10px;color:var(--mute);font-family:var(--body)}

/* 舞台 */
.stage{flex:1;background:var(--paper);border-radius:28px;border:3px solid var(--line);padding:18px clamp(12px,3vw,32px) 22px;position:relative;overflow:hidden;min-height:480px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ktitle{padding-inline:60px;font-family:var(--kid);font-size:clamp(26px,4.4vw,40px);margin:4px 0 0;text-align:center;text-wrap:balance;line-height:1.25}
.ksub{font-family:var(--kid);font-size:clamp(18px,2.6vw,24px);color:var(--mute);margin:0;text-align:center}
.speak{position:absolute;right:14px;top:14px;width:58px;height:58px;border-radius:50%;background:var(--accent-2);border:3px solid var(--happy);font-size:28px}
.speak:active{transform:scale(.94)}

.grid{display:grid;gap:clamp(8px,1.6vw,18px);width:100%;justify-items:center}
.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:820px){.g6{grid-template-columns:repeat(6,minmax(0,1fr))}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:760px}
.g4{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}
@media (min-width:820px){.g4{grid-template-columns:repeat(4,minmax(0,1fr));max-width:900px}}
.fbtn{width:100%;max-width:190px;aspect-ratio:1/1.12;border-radius:26px;background:var(--paper);border:4px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;transition:transform .15s}
.fbtn svg{width:100%;height:auto;max-height:82%}
.fbtn span{font-family:var(--kid);font-size:clamp(16px,2.2vw,22px);margin-top:2px}
.fbtn:active{transform:scale(.95)}
.fbtn.pick{border-color:var(--accent);background:var(--accent-2)}
.fbtn.ok{border-color:var(--calm);background:#E3F7EC;animation:pop .5s}
.fbtn.no{animation:shake .45s}
.nolabel .fbtn span{visibility:hidden}

.big{width:min(340px,70vw);max-width:100%}
.big svg{width:100%;height:auto}
.name{font-family:var(--kid);font-size:clamp(40px,8vw,72px);line-height:1;margin:0}
.cue{font-family:var(--kid);font-size:clamp(18px,2.8vw,26px);background:var(--accent-2);padding:8px 18px;border-radius:999px}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.kbtn{font-family:var(--kid);font-size:clamp(20px,3vw,28px);background:var(--accent);color:#fff;border-radius:999px;padding:14px 28px;min-height:64px;box-shadow:0 5px 0 #1D5878;display:inline-flex;align-items:center;gap:10px}
.kbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1D5878}
.kbtn.soft{background:var(--paper);color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.kbtn.green{background:var(--calm);box-shadow:0 5px 0 #23845A}
.kbtn.yellow{background:var(--happy);color:#4A3200;box-shadow:0 5px 0 #C08B12}
.arrow{width:72px;height:72px;border-radius:50%;background:var(--paper);border:3px solid var(--line);font-size:34px;box-shadow:0 5px 0 var(--line)}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--paper);padding:2px}
.dot.on{border-color:var(--accent)}
.dot svg{width:100%;height:100%}
.prog{display:flex;gap:6px;justify-content:center}
.prog i{width:22px;height:22px;border-radius:50%;background:var(--line);display:block}
.prog i.on{background:var(--happy);box-shadow:0 0 0 3px #FFE7A3}

/* 情境 */
.scene{width:min(560px,100%);aspect-ratio:16/9;border-radius:24px;background:linear-gradient(#DFF0FF,#F6FBFF 70%,#E7F3DF 70%);display:flex;align-items:center;justify-content:center;gap:4%;position:relative;overflow:hidden;border:3px solid var(--line)}
.scene .m{font-size:clamp(64px,14vw,120px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
.scene .s{font-size:clamp(40px,8vw,70px);line-height:1}
.scene .bear{width:28%}
.scene .bear svg{width:100%;height:auto}
.narr{font-size:16px;color:var(--mute);text-align:center;margin:0}

/* 心情大小 */
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px);width:100%}
.sz{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:24px;padding:6px;border:4px solid transparent}
.sz.pick{border-color:var(--accent);background:var(--accent-2)}
.sz .ball{border-radius:50%;display:grid;place-items:center}
.sz .ball svg{width:80%;height:auto}
.sz span{font-family:var(--kid);font-size:clamp(18px,2.6vw,24px)}

/* 冷靜魔法 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{font-family:var(--kid);font-size:clamp(16px,2.2vw,22px);padding:10px 16px;border-radius:18px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;min-width:92px}
.tab b{font-size:38px;font-weight:400;line-height:1.1}
.tab.on{border-color:var(--accent);background:var(--accent-2)}
.balloonbox{height:300px;display:flex;align-items:center;justify-content:center}
.balloon{width:150px;transform-origin:50% 85%;transition:transform 3s ease-in-out}
.breathword{font-family:var(--kid);font-size:clamp(32px,6vw,52px);min-height:1.3em;margin:0}
.heart{font-size:150px;line-height:1;animation:beat 1.2s infinite}
.count{display:flex;gap:10px;justify-content:center}
.count i{font-style:normal;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--kid);font-size:36px;background:var(--line);color:var(--paper);transition:.3s}
.count i.on{background:var(--calm);transform:scale(1.15)}
.phrase{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(620px,100%)}
@media (min-width:820px){.phrase{grid-template-columns:repeat(4,minmax(0,1fr));width:min(900px,100%)}}
.ph{border-radius:22px;border:3px solid var(--line);background:var(--paper);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--kid);font-size:clamp(17px,2.2vw,22px)}
.ph b{font-size:48px;font-weight:400;line-height:1.1}
.ph.pick{border-color:var(--calm);background:#E3F7EC}
.sentence{font-family:var(--kid);font-size:clamp(22px,3.6vw,34px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--accent-2);border-radius:20px;padding:10px 18px;min-height:76px;text-align:center}
.sentence svg{width:58px;height:58px}

/* 積木 */
.tower{position:relative;width:min(420px,100%);height:340px;border-bottom:10px solid #B9D6A8;border-radius:0 0 12px 12px}
.blk{position:absolute;width:96px;height:44px;border-radius:10px;left:50%;border:3px solid rgba(0,0,0,.12);transition:transform 1s cubic-bezier(.5,0,.8,.6),opacity 1s}
.blk::after{content:"";position:absolute;inset:6px 10px auto;height:8px;border-radius:6px;background:rgba(255,255,255,.45)}
.flag{position:absolute;left:calc(50% + 70px);font-size:34px}
.wob{animation:wobble .6s 2}
.overlay .ktitle{padding-inline:0}
.overlay{position:absolute;inset:0;background:rgba(255,255,255,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:3}

/* 鏡子 */
.mirror{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.mirror video{width:min(340px,80vw);aspect-ratio:1;object-fit:cover;border-radius:50%;transform:scaleX(-1);border:8px solid var(--happy);background:#000}

/* 大人用 */
.adult{background:var(--paper);border-radius:20px;border:2px dashed var(--line);padding:12px 16px;font-size:15px;line-height:1.7}
.adult h3{margin:0 0 4px;font-size:15px;color:var(--accent)}
.adult p{margin:0;max-width:72ch}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;width:100%;margin:0;padding:0;list-style:none}
.plan li{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-size:15px}
.plan li b{font-size:28px;font-weight:400}
.plan li span{display:flex;flex-direction:column;line-height:1.3}
.plan li small{color:var(--mute);font-variant-numeric:tabular-nums}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:16px}
.field input{font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);width:12em}
.summary{width:100%;font-family:var(--body);font-size:15px;line-height:1.7;border:2px solid var(--line);border-radius:14px;padding:12px;min-height:200px;resize:vertical}
.tips{margin:0;padding-left:1.2em;line-height:1.8;font-size:15px;max-width:72ch}
.cols{display:grid;grid-template-columns:1fr;gap:14px;width:100%}
@media (min-width:820px){.cols{grid-template-columns:1fr 1fr}}
.cols>div{min-width:0}
.stickers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stk{font-size:56px;width:88px;height:88px;border-radius:24px;border:3px solid var(--line);background:var(--paper)}
.stk.pick{border-color:var(--happy);background:var(--accent-2);animation:pop .5s}
.starline{font-size:30px;letter-spacing:2px;text-align:center;max-width:640px;word-break:break-all}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:20}

/* 動畫 */
.live.f-happy .bob{animation:hop 1.1s ease-in-out infinite;transform-origin:50% 100%}
.live.f-sad .bob{animation:droop 3s ease-in-out infinite;transform-origin:50% 100%}
.live.f-sad .tear{animation:tear 1.8s ease-in infinite}
.live.f-angry .bob{animation:grr .35s linear infinite}
.live.f-scared .bob{animation:shiver .14s linear infinite}
.live.f-surprised .bob{animation:wow 1.6s ease-out infinite;transform-origin:50% 60%}
.live.f-calm .bob{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.02,.98)}}
@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(6px) rotate(-2deg)}}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes grr{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes shiver{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
@keyframes wow{0%{transform:scale(1)}12%{transform:scale(1.08)}30%,100%{transform:scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.floaty{animation:floaty 2s ease-in-out infinite}
.confetti{position:fixed;top:-20px;font-size:28px;pointer-events:none;z-index:30;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" id="brand"></div>
    <div class="pill" title="上課經過時間">⏱ <b id="clock">00:00</b><span id="plan"></span></div>
    <div class="pill" title="今天得到的星星">⭐ <b id="stars">0</b></div>
    <button class="iconbtn" id="sound" aria-pressed="true">🔊 聲音</button>
    <button class="iconbtn" id="tipbtn" aria-pressed="false">🧑‍🏫 大人提示</button>
  </header>
  <nav class="steps" id="steps" aria-label="課程站別"></nav>
  <main class="stage" id="stage"></main>
  <section class="adult" id="tip" hidden></section>
  <footer class="foot">
    <button class="arrow" id="prev" aria-label="上一站">◀</button>
    <span class="narr" id="where"></span>
    <button class="arrow" id="next" aria-label="下一站">▶</button>
  </footer>
</div>

<script>
/* ---------- 資料 ---------- */
const EM={
  happy:{name:'開心',color:'#FFC23C',cue:'嘴巴笑笑・眼睛彎彎',say:'這是開心。開心的時候，嘴巴笑笑，眼睛彎彎，想要跳一跳！',reply:'太棒了，熊熊也好開心！'},
  sad:{name:'難過',color:'#5B9BE6',cue:'嘴巴往下・掉眼淚',say:'這是難過。難過的時候，嘴巴往下，眼淚掉下來，想要抱抱。',reply:'難過沒關係，熊熊陪你。'},
  angry:{name:'生氣',color:'#EF5350',cue:'眉毛皺皺・臉紅紅・握拳頭',say:'這是生氣。生氣的時候，眉毛皺起來，臉紅紅的，手會握拳頭。',reply:'生氣了啊。等一下我們來學冷靜魔法。'},
  scared:{name:'害怕',color:'#9B7BD8',cue:'眼睛張大・身體抖抖',say:'這是害怕。害怕的時候，眼睛張好大，身體抖抖抖，想要躲起來。',reply:'害怕的時候，熊熊在你旁邊。'},
  surprised:{name:'驚訝',color:'#FF7EB6',cue:'眼睛圓圓・嘴巴變 O',say:'這是驚訝。驚訝的時候，眼睛圓圓的，嘴巴變成一個圓圈，哇！',reply:'哇！有什麼驚喜嗎？'},
  calm:{name:'平靜',color:'#3DBE84',cue:'身體軟軟・慢慢呼吸',say:'這是平靜。平靜的時候，身體軟軟的，慢慢呼吸，好舒服。',reply:'平平靜靜，好舒服。'}
};
const ORDER=['happy','sad','angry','scared','surprised','calm'];
const NEG=['sad','angry','scared'];

const SCENES=[
  {pic:['🧱','💥'],txt:'熊熊蓋好的積木，碰！倒掉了。',ans:['angry','sad'],fix:'積木倒了，好生氣喔。我們先吹吹氣球，再蓋一次！'},
  {pic:['🍦','💧'],txt:'熊熊的冰淇淋，掉到地上了。',ans:['sad'],fix:'冰淇淋掉了好難過。可以跟媽媽說：我好難過，抱抱我。'},
  {pic:['🎁','✨'],txt:'熊熊收到一個禮物！',ans:['happy','surprised'],fix:'收到禮物好開心，可以跟大家說謝謝！'},
  {pic:['⛈️','⚡'],txt:'轟隆隆！外面打雷了。',ans:['scared','surprised'],fix:'打雷好害怕，可以抱抱媽媽，慢慢吹氣球。'},
  {pic:['🎈','💨'],txt:'熊熊的氣球，飛走了。',ans:['sad'],fix:'氣球飛走了好難過。可以說：我好難過，幫幫我。'},
  {pic:['🧩','❓'],txt:'拼圖一直拼不進去。',ans:['angry','sad'],fix:'拼不進去好生氣。先休息一下，再試一次，或說：幫幫我！'},
  {pic:['🚗','✋'],txt:'熊熊的小汽車，被別人拿走了。',ans:['angry','sad'],fix:'玩具被拿走好生氣。不要打人，可以說：這是我的，請還我。'},
  {pic:['📦','🐶'],txt:'打開盒子，跳出一隻小狗！',ans:['surprised','happy'],fix:'哇！好驚訝！'},
  {pic:['👩‍👦','❤️'],txt:'睡覺前，媽媽抱抱熊熊。',ans:['calm','happy'],fix:'被抱抱，身體軟軟的，好舒服。'},
  {pic:['🐕','🔊'],txt:'一隻大狗，汪汪汪大聲叫。',ans:['scared','surprised'],fix:'大狗叫好害怕，可以躲到大人後面，慢慢呼吸。'},
  {pic:['👟','😣'],txt:'鞋子一直穿不進去。',ans:['angry','sad'],fix:'鞋子穿不進去好生氣。可以說：我需要幫忙！'},
  {pic:['🖍️','〰️'],txt:'畫畫的時候，線畫歪了。',ans:['sad','angry'],fix:'畫歪了沒關係，再畫一次就好了！'},
  {pic:['🎡','🎶'],txt:'熊熊去遊樂園玩！',ans:['happy'],fix:'去遊樂園好開心！'},
  {pic:['🛒','❓'],txt:'在賣場，突然找不到媽媽。',ans:['scared','sad'],fix:'找不到媽媽好害怕，站著不要跑，找店員阿姨幫忙。'},
  {pic:['📖','🌙'],txt:'躺在床上，聽媽媽講故事。',ans:['calm','happy'],fix:'聽故事，慢慢呼吸，好平靜。'}
];

/* ---------- 聲音 ---------- */
let voice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_]HK/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let lastSay='';
function say(t){
  if(!t)return; t=t.replaceAll('{name}',S.name); lastSay=t;
  if(!S.sound||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';if(voice)u.voice=voice;u.rate=.88;u.pitch=1.15;speechSynthesis.speak(u);},60);
}
let ac=null;
function tone(fs,dur=.15,type='sine',gap=.12){
  if(!S.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const t=ac.currentTime+i*gap;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur+.2);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.25);});}catch(e){}
}
const sfx={ok:()=>tone([660,880,1175]),no:()=>tone([330,262],.18,'triangle',.16),win:()=>tone([523,659,784,1047,1319],.18,'sine',.1),pop:()=>tone([740],.06,'triangle',0)};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function addStar(n=1){S.stars+=n;$('#stars').textContent=S.stars;$('#stars').parentElement.animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:400});}
function confetti(n=24){const set=['⭐','🎉','💛','✨','🎈'];for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';c.textContent=rnd(set);c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2600);}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

function go(i){
  i=Math.max(0,Math.min(STATIONS.length-1,i));
  clearT();stopCam();if('speechSynthesis' in window)speechSynthesis.cancel();
  if(S.idx!==i&&S.idx>0)S.done.add(S.idx);
  S.idx=i;S.stationStart=Date.now();
  const st=STATIONS[i],stage=$('#stage');
  stage.innerHTML='';stage.scrollTop=0;
  st.render(stage);
  drawSteps();
  $('#tip').innerHTML=`<h3>${st.icon} ${st.title}${st.min?`・建議 ${st.min} 分鐘`:''}</h3><p>${st.tip}</p>`;
  $('#where').textContent=i?`第 ${i} 站／共 ${STATIONS.length-1} 站：${st.title}`:'';
  $('#prev').style.visibility=i?'visible':'hidden';
  $('#next').style.visibility=i<STATIONS.length-1?'visible':'hidden';
}
function drawSteps(){
  $('#steps').innerHTML=STATIONS.map((s,i)=>`<button class="step ${i===S.idx?'on':''} ${S.done.has(i)?'done':''}" data-i="${i}" aria-label="${s.title}" title="${s.title}">${s.icon}<small>${s.min?s.min+'分':''}</small></button>`).join('');
  $$('.step').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const on=$('.step.on');on&&on.scrollIntoView({block:'nearest',inline:'center'});
}
function speakBtn(stage,getText){const b=document.createElement('button');b.className='speak';b.setAttribute('aria-label','再聽一次');b.textContent='🔊';b.onclick=()=>say(getText?getText():lastSay);stage.appendChild(b);}

function stFind(stage){
  let n=2,hide=false,streak=0,round=0,target,busy=false;
  stage.innerHTML=`<h2 class="ktitle" id="q"></h2>
   <div class="row">
     <button class="kbtn soft" data-n="2">●●</button><button class="kbtn soft" data-n="3">●●●</button><button class="kbtn soft" data-n="4">●●●●</button>

   <div id="opts" class="grid"></div><div class="prog" id="prog"></div>`;
  speakBtn(stage,()=>`哪一個是${EM[target].name}？`);
  $$('[data-n]',stage).forEach(b=>b.onclick=()=>{n=+b.dataset.n;mark();ask()});
  $('#hide',stage).onclick=()=>{hide=!hide;$('#opts',stage).classList.toggle('nolabel',hide);$('#hide',stage).textContent=hide?'👀 顯示字':'🙈 藏字'};
  function mark(){$$('[data-n]',stage).forEach(b=>{b.style.borderColor=+b.dataset.n===n?'var(--accent)':''})}
  function prog(){$('#prog',stage).innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<round?'on':''}"></i>`).join('')}
  function ask(){
    busy=false;let prev=target;do{target=rnd(ORDER)}while(target===prev);
    const opts=shuffle([target,...shuffle(ORDER.filter(x=>x!==target)).slice(0,n-1)]);
    const g=$('#opts',stage);g.className='grid '+(n===2?'g2':n===3?'g3':'g4')+(hide?' nolabel':'');
    g.innerHTML=opts.map(id=>fbtn(id)).join('');
    $('#q',stage).textContent=`哪一個是「${EM[target].name}」？`;
    say(`哪一個是${EM[target].name}？`);
    $$('.fbtn',g).forEach(b=>b.onclick=()=>{
      if(busy)return;const id=b.dataset.em;S.log.find.total++;
      if(id===target){busy=true;S.log.find.ok++;b.classList.add('ok');$('svg',b).classList.add('live');sfx.ok();addStar();streak++;round++;prog();
        if(round>=5){later(()=>{sfx.win();confetti(30);say('五題都找到了，你好棒！');round=0;prog();
          if(n<4&&streak>=4){n++;mark();}},900);later(ask,4200)}
        else{say(rnd(['答對了！','好棒！','就是它！','你找到了！']));later(ask,1700)}
      }else{streak=0;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.no();
        say(`這是${EM[id].name}。再找找看，${EM[target].name}在哪裡？`)}
    });
  }
  mark();prog();ask();
}

/* 5 發生什麼事 */
function stScene(stage){
  let order=shuffle(SCENES),k=0;
  function draw(){
    const sc=order[k%order.length];
    const others=shuffle(ORDER.filter(x=>!sc.ans.includes(x))).slice(0,2);
    const opts=shuffle([sc.ans[0],...others]);
    stage.innerHTML=`<h2 class="ktitle">發生什麼事？熊熊覺得怎麼樣？</h2>
      <div class="scene"><span class="m floaty">${sc.pic[0]}</span><span class="s">${sc.pic[1]}</span><span class="bear">${face('calm')}</span></div>
      <p class="narr">${sc.txt}</p>
      <div class="grid g3" id="opts">${opts.map(id=>fbtn(id)).join('')}</div>
      <div class="row" id="after"></div>`;
    speakBtn(stage,()=>sc.txt+'熊熊覺得怎麼樣？');
    say(sc.txt+' 熊熊覺得怎麼樣？');
    let answered=false;
    $$('.fbtn',stage).forEach(b=>b.onclick=()=>{
      if(answered)return;answered=true;const id=b.dataset.em,hit=sc.ans.includes(id);
      S.log.scenes.push({txt:sc.txt,pick:id,hit});
      const show=hit?id:sc.ans[0];
      $('.bear',stage).innerHTML=face(show,'live');
      if(hit){b.classList.add('ok');sfx.ok();addStar();say(`對！${sc.txt.replace(/。$/,'')}，會覺得${EM[id].name}。${sc.fix}`)}
      else{b.classList.add('pick');sfx.pop();say(`你覺得是${EM[id].name}。熊熊覺得有一點${EM[sc.ans[0]].name}，你看熊熊的臉。${sc.fix}`)}
      const neg=NEG.includes(show);
      $('#after',stage).innerHTML=(neg?`<button class="kbtn soft" id="fix">🎈 用冷靜魔法</button>`:'')+`<button class="kbtn" id="nx">下一個 ▶</button>`;
      $('#nx',stage).onclick=()=>{k++;draw()};
      if(neg)$('#fix',stage).onclick=()=>go(7);
    });
  }
  draw();
}

/* 7 冷靜魔法 */
function breathe(box,rounds,onDone){
  box.innerHTML=`<div class="balloonbox"><svg class="balloon" viewBox="0 0 120 170" aria-label="氣球">
     <ellipse cx="60" cy="62" rx="50" ry="58" fill="#EF5350"/><ellipse cx="42" cy="40" rx="12" ry="18" fill="#fff" opacity=".45"/>
     <path d="M54 118 L66 118 L60 128Z" fill="#C62828"/><path d="M60 128 Q50 145 62 158 Q70 166 60 170" stroke="#8A6A55" stroke-width="3" fill="none"/></svg></div>
   <p class="breathword" id="bw">準備好了嗎？</p><div class="prog" id="bp"></div>`;
  const bal=$('.balloon',box),bw=$('#bw',box),bp=$('#bp',box);let i=0;
  const prog=()=>bp.innerHTML=Array.from({length:rounds},(_,j)=>`<i class="${j<i?'on':''}"></i>`).join('');
  prog();bal.style.transform='scale(.55)';
  function cycle(){
    if(i>=rounds){bw.textContent='好棒！身體軟軟的了';say('好棒！身體軟軟的，好舒服。');sfx.win();onDone&&onDone();return}
    bw.textContent='👃 鼻子吸～';say('鼻子吸～');bal.style.transitionDuration='3s';bal.style.transform='scale(.55)';
    // 吸氣：氣球先變小（空氣進身體），吐氣：把氣吹進氣球
    later(()=>{bw.textContent='🌬️ 嘴巴慢慢吹～';say('嘴巴慢慢吹～');bal.style.transitionDuration='4s';bal.style.transform='scale(1.15)';},3200);
    later(()=>{i++;prog();sfx.pop();later(cycle,500)},7600);
  }
  say('我們一起吹氣球。');later(cycle,1600);
}

/* 8 再試一次 */
function stRetry(stage){
  const GOAL=6,COLORS=['#FFC23C','#5B9BE6','#EF5350','#3DBE84','#9B7BD8','#FF7EB6','#FF9F43'];
  let attempt=0,blocks=[],willFall=true,fallAt=4,busy=false;
  stage.innerHTML=`<h2 class="ktitle">蓋一座高高的塔！</h2>
    <div class="tower" id="tw"><span class="flag" style="bottom:${GOAL*44+4}px">🚩</span></div>
    <div class="row"><button class="kbtn yellow" id="add">🧱 放一塊</button></div>
    <p class="narr" id="st"></p>`;
  speakBtn(stage);
  const tw=$('#tw',stage);
  function reset(){
    blocks.forEach(b=>b.remove());blocks=[];busy=false;
    willFall=attempt%2===0; fallAt=3+Math.floor(Math.random()*2); // 第 1、3、5…次會倒；第 2、4…次會成功
    $('#st',stage).textContent=`第 ${attempt+1} 次・勇敢再試 ${S.log.retries} 次・蓋好 ${S.log.builds} 座`;
  }
  $('#add',stage).onclick=()=>{
    if(busy)return;sfx.pop();
    const n=blocks.length,b=document.createElement('div');b.className='blk';
    const off=(Math.random()*24-12)+(willFall?n*3:0);
    b.style.background=COLORS[n%COLORS.length];b.style.bottom=(n*44)+'px';b.style.marginLeft=(-48+off)+'px';
    tw.appendChild(b);blocks.push(b);
    if(willFall&&blocks.length>=fallAt){busy=true;fall()}
    else if(!willFall&&blocks.length>=GOAL){busy=true;win()}
    else say(rnd(['再一塊！','好高喔！','小心放～','穩穩的！']));
  };
  function fall(){
    blocks.forEach(b=>b.classList.add('wob'));say('咦？搖搖晃晃……');
    later(()=>{tone([400,300,200],.2,'triangle',.12);blocks.forEach((b,i)=>{b.classList.remove('wob');b.style.transform=`translate(${(i%2?1:-1)*(60+i*30)}px,${i*44+20}px) rotate(${(i%2?1:-1)*(40+i*20)}deg)`;})},1300);
    later(()=>{
      const ov=document.createElement('div');ov.className='overlay';
      ov.innerHTML=`<p class="ktitle">倒掉了！你覺得怎麼樣？</p><div class="grid g3">${['angry','sad','calm'].map(id=>fbtn(id)).join('')}</div>`;
      stage.appendChild(ov);say('哎呀！倒掉了！{name}，你覺得怎麼樣？');
      $$('.fbtn',ov).forEach(x=>x.onclick=()=>{
        const id=x.dataset.em;sfx.pop();
        ov.innerHTML=`<div class="big" style="width:min(150px,36vw)">${face(id,'live')}</div><p class="ksub">${id==='calm'?'你好冷靜！':'好'+EM[id].name+'，沒關係。'}我們吹三次氣球</p><div id="bb" style="display:flex;flex-direction:column;align-items:center"></div>`;
        say(id==='calm'?'你好冷靜！我們還是吹三次氣球。':`好${EM[id].name}喔，沒關係。我們一起吹三次氣球。`);
        later(()=>breathe($('#bb',ov),3,()=>later(()=>{
          ov.innerHTML=`<div class="big" style="width:min(170px,40vw)">${face('happy','live')}</div><button class="kbtn green" id="again" style="font-size:32px">🔁 再試一次！</button>`;
          say('沒關係，我們再試一次！');
          $('#again',ov).onclick=()=>{S.log.retries++;attempt++;addStar(2);sfx.ok();say('好勇敢！再試一次！');ov.remove();reset()};
        },1200)),2200);
      });
    },2600);
  }
  function win(){
    S.log.builds++;sfx.win();confetti(36);addStar(3);
    say('蓋好了！你剛剛有再試一次，所以成功了！好厲害！');
    later(()=>{const ov=document.createElement('div');ov.className='overlay';
      ov.innerHTML=`<div class="big" style="width:min(200px,44vw)">${face('happy','live')}</div><p class="ktitle">蓋好了！🚩</p><p class="ksub">倒了也沒關係，再試一次就會成功</p><button class="kbtn" id="more">🧱 再蓋一座</button>`;
      stage.appendChild(ov);$('#more',ov).onclick=()=>{attempt++;ov.remove();reset();say('再蓋一座！')}},1600);
  }
  reset();
  say('我們來蓋一座高高的塔，蓋到紅色旗子那麼高。按放一塊。');
}

go(0);
</script>
